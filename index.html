<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestro Hogar - Playlist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-image: url("fondo.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .spotify-container {
      width: 100%;
      max-width: 900px;
      min-width: 0;
    }

    .spotify-container iframe {
      display: block;
      width: 100%;
      height: 352px !important;
      min-height: 352px;
      border: 0;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
        background-attachment: scroll;
      }

      .spotify-container iframe {
        height: 352px !important;
      }
    }
  </style>
</head>

<body>
  <main class="spotify-container">
    <iframe
      title="Playlist Nuestro Hogar en Spotify"
      src="https://open.spotify.com/embed/playlist/1h7EmIO28QzELs6ILPd5Yd?utm_source=generator"
      width="100%"
      height="352"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </main>
</body>
</html>
