<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7e6b8">
  <title>Playlist de Spotify</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #f7e6b8;
      background-image: url("fondo.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
    }

    .spotify-player {
      display: block;
      width: 100%;
      max-width: 660px;
      height: 352px;
      border: 0;
      border-radius: 12px;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
        background-position: center center;
      }

      .spotify-player {
        height: 352px;
      }
    }
  </style>
</head>
<body>
  <iframe
    class="spotify-player"
    data-testid="embed-iframe"
    style="border-radius:12px"
    src="https://open.spotify.com/embed/playlist/1h7EmIO28QzELs6ILPd5Yd?utm_source=generator&si=9e45923c4fc44728"
    width="100%"
    height="352"
    frameborder="0"
    allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy"
    title="Playlist de Spotify">
  </iframe>
</body>
</html>
